version: 2

updates:
  # NuGet packages across all projects in LB.PhotoGalleries.sln.
  # Dependabot discovers every .csproj from the repository root.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # Roll routine servicing updates into a single weekly PR so the
      # review burden stays proportional to the risk.
      nuget-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # These packages track the .NET release cadence, so their major
      # versions require a matching target framework. The solution is on
      # net10.0; suppressing majors avoids a standing pile of 11.x PRs that
      # cannot be merged. Revisit when moving to the next target framework.
      #
      # Security updates are unaffected: .NET servicing fixes ship as
      # patches on the 10.0.x line, which is not ignored here.
      - dependency-name: "Microsoft.Extensions.*"
        update-types:
          - version-update:semver-major
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types:
          - version-update:semver-major
      - dependency-name: "Serilog.AspNetCore"
        update-types:
          - version-update:semver-major

      # Packages deliberately held back. Each ignores *minor* updates only, so
      # patch releases on the current line still raise PRs — a security fix
      # shipped as e.g. Imageflow.Net 0.14.x would not be suppressed.
      #
      # Microsoft.ApplicationInsights.AspNetCore 3.x pulls
      # Microsoft.ApplicationInsights 3.x, which Serilog.Sinks.ApplicationInsights
      # 5.0.1 excludes (requires >= 2.23.0 && < 3.0.0). This one is worth calling
      # out: the mismatch surfaces as NU1608, a *warning*, so such a PR can pass
      # CI while leaving a real runtime incompatibility. Remove when the Serilog
      # sink supports App Insights 3.x.
      - dependency-name: "Microsoft.ApplicationInsights.AspNetCore"
        update-types:
          - version-update:semver-major

      # Imageflow.Net and Spectre.Console are 0.x, where a minor bump is
      # breaking by convention. Imageflow also carries a native runtime.
      # Remove once each has been smoke-tested against real image processing
      # rather than a compile check.
      - dependency-name: "Imageflow.Net"
        update-types:
          - version-update:semver-minor
      - dependency-name: "Spectre.Console"
        update-types:
          - version-update:semver-minor

  # GitHub Actions used by the CodeQL and deployment workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      actions-all:
        patterns:
          - "*"
