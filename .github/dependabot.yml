version: 2

updates:
  # NuGet packages across all projects in LB.PhotoGalleries.sln.
  # Dependabot discovers every .csproj from the repository root.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # Roll routine servicing updates into a single weekly PR so the
      # review burden stays proportional to the risk.
      nuget-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # These packages track the .NET release cadence, so their major
      # versions require a matching target framework. The solution is on
      # net9.0; suppressing majors avoids a standing pile of 10.x PRs that
      # cannot be merged. Remove this block when moving to net10.0.
      #
      # Security updates are unaffected: .NET servicing fixes ship as
      # patches on the 9.0.x line, which is not ignored here.
      - dependency-name: "Microsoft.Extensions.*"
        update-types:
          - version-update:semver-major
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types:
          - version-update:semver-major
      - dependency-name: "Serilog.AspNetCore"
        update-types:
          - version-update:semver-major

      # Packages deliberately held back. Each ignores *minor* updates only, so
      # patch releases on the current line still raise PRs — a security fix
      # shipped as e.g. Azure.Storage.Blobs 12.26.x would not be suppressed.
      #
      # Azure.Storage: 12.29.1/12.27.1 raise the Azure.Core floor to 1.55.0,
      # which depends on Microsoft.Extensions.{Configuration,Hosting}
      # .Abstractions 10.0.3 and drags the solution onto the .NET 10 package
      # line (NU1605 package downgrade). Azure.Core 1.47.3 has no
      # Microsoft.Extensions dependencies. Remove when moving to net10.0.
      - dependency-name: "Azure.Storage.Blobs"
        update-types:
          - version-update:semver-minor
      - dependency-name: "Azure.Storage.Queues"
        update-types:
          - version-update:semver-minor

      # Imageflow.Net and Spectre.Console are 0.x, where a minor bump is
      # breaking by convention. Imageflow also carries a native runtime.
      # Remove once each has been smoke-tested against real image processing
      # rather than a compile check.
      - dependency-name: "Imageflow.Net"
        update-types:
          - version-update:semver-minor
      - dependency-name: "Spectre.Console"
        update-types:
          - version-update:semver-minor

  # GitHub Actions used by the CodeQL and deployment workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      actions-all:
        patterns:
          - "*"
